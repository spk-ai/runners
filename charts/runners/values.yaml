nameOverride: ""
fullnameOverride: "runners"

global:
  imageRegistry: ""
  imagePullSecrets: []

image:
  registry: ""
  repository: ghcr.io/agynio/runners
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1
revisionHistoryLimit: 10
updateStrategy: {}

deploymentAnnotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

automountServiceAccountToken: true

# Caller authorization for the control-plane gRPC API (internal/rpcauth).
# Callers send an audience-bound projected ServiceAccount token in the
# x-agyn-caller-token metadata key; runners validates it with a TokenReview
# and applies these grants. Method classes are fixed in code
# (internal/rpcauth/classification.json); only who may call them is configured.
rpcAuth:
  # enforce rejects every call the policy does not allow. permissive only logs
  # decisions; it exists for callers that cannot send tokens yet and must not
  # be used in production.
  mode: enforce
  # Dedicated token audience; callers project tokens for exactly this value.
  audience: agyn-runners
  # Reuse of a successful TokenReview, 1-60s. It bounds how long a token from a
  # deleted pod stays accepted.
  cacheTTLSeconds: 30
  # One entry per caller ServiceAccount. An empty namespace means the release
  # namespace. Classes: orchestrator, identity, internal, runnerToken (denied
  # can never be granted). identity and internal grants state whether
  # x-identity-id is required; methods narrows a grant to part of its class.
  callers:
    - serviceAccount: agents-orchestrator
      namespace: ""
      grants:
        - class: orchestrator
        - class: identity
          identity: optional
          methods:
            - GetRunner
            - ListRunners
            - ListFlavors
            - GetWorkload
            - ListWorkloadsByThread
            - ListWorkloadsByAgentInstance
            - GetVolume
            - ListVolumes
            - ListVolumesByThread
            - ListVolumesByAgentInstance
        - class: internal
          identity: optional
          methods:
            - ListWorkloads
    - serviceAccount: gateway
      namespace: ""
      grants:
        - class: identity
          identity: required
        - class: internal
          identity: required
        - class: runnerToken
  # Reads opened to callers that send no token (unforked chat, expose,
  # notifications). Only GetWorkload, ListWorkloadsByThread and
  # ListWorkloadsByAgentInstance are eligible. Nothing authenticates such a
  # caller: anything that can reach the gRPC port may make these calls with any
  # claimed identity. Keep it empty unless a feature needs it, for example
  #   - method: ListWorkloadsByThread
  #     identity: required
  tokenless: []
  # ClusterRole/ClusterRoleBinding granting only create on
  # tokenreviews.authentication.k8s.io to this ServiceAccount. Disable when the
  # cluster owner manages that binding separately.
  tokenReviewRBAC:
    create: true

rbac:
  create: false
  clusterWide: false
  rules: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  enabled: false
  fsGroup: null

securityContext:
  enabled: true
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

priorityClassName: ""
terminationGracePeriodSeconds: null

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  labels: {}
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP

containerPorts:
  - name: grpc
    containerPort: 50051
    protocol: TCP

command: []
args: []
env:
  - name: GRPC_ADDR
    value: ":50051"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: agyn-platform-database-urls
        key: runners
  - name: IDENTITY_ADDRESS
    value: "identity:50051"
  - name: AUTHORIZATION_ADDRESS
    value: "authorization:50051"
envFrom: []
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""

configMounts: []
extraVolumeMounts: []
extraVolumes: []

initContainers: []
extraContainers: []

lifecycle: {}

livenessProbe:
  enabled: true
  tcpSocket:
    port: grpc
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  tcpSocket:
    port: grpc
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  enabled: false

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: null
  maxUnavailable: null

ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
  hosts: []
  tls: []

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: ""
    scrapeTimeout: ""
    honorLabels: false
    labels: {}
    annotations: {}
    relabelings: []
    metricRelabelings: []
    endpoints:
      - port: grpc
        path: /metrics
        interval: ""
        scrapeTimeout: ""
