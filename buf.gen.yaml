version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/agynio/runners/.gen/go

plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: .gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.1
    out: .gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

inputs:
  - git_repo: https://github.com/spk-ai/api.git
    ref: ce64da8680c39a13f7174c3146b38f3bfcc03037
    subdir: proto
