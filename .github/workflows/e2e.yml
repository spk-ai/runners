name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned E2E tooling
        uses: actions/checkout@v4
        with:
          repository: agynio/e2e
          ref: 435b549a937129b6858e7314648eb690894209fe
          path: .e2e-tooling
          persist-credentials: false

      - name: Prepare disposable VM image repair and diagnostics
        run: python3 .github/e2e/prepare.py .e2e-tooling

      - name: Provision cluster
        uses: ./.e2e-tooling/.github/actions/provision-vm
        with:
          agyn-cli-version: v0.19.0

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@435b549a937129b6858e7314648eb690894209fe

      - name: Install gRPC health probe
        run: |
          set -euo pipefail
          version="v0.4.38"
          curl -fsSL --retry 3 --retry-delay 5 \
            -o /tmp/grpc_health_probe \
            "https://github.com/grpc-ecosystem/grpc-health-probe/releases/download/${version}/grpc_health_probe-linux-amd64"
          sudo install -c -m 0755 /tmp/grpc_health_probe /usr/local/bin/grpc_health_probe
          grpc_health_probe -version

      - name: Deploy runners from source
        run: |
          set -euo pipefail
          RUNNER_TRACKING_ID="" devspace dev --watch > /tmp/runners-devspace.log 2>&1 &
          echo "$!" > /tmp/runners-devspace.pid
          devspace run-pipeline wait-runners

      - name: Run E2E tests
        uses: agynio/e2e/.github/actions/run-tests@435b549a937129b6858e7314648eb690894209fe
        with:
          e2e-ref: 435b549a937129b6858e7314648eb690894209fe
          service: runners
          include_smoke: "false"

      # Provisioning uses a disposable Helm-owned VM, with no ArgoCD apps.
      - name: Stop disposable platform VM
        if: always()
        run: |
          if command -v agyn >/dev/null 2>&1; then
            agyn local stop
          fi
