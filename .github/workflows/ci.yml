name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: runners_volume_acceptance
          POSTGRES_PASSWORD: runners-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d runners_volume_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Install buf
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.66.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Prepared workloads and anchored volumes require this reviewed API tree.
      - name: Checkout matching API contract
        uses: actions/checkout@v4
        with:
          repository: spk-ai/api
          ref: 647cc17d3a8171ddf41256b3a8a8c1aaa8c7c6e2
          path: .ci-api
          persist-credentials: false

      - name: Generate protobuf bindings
        run: buf generate .ci-api --include-imports

      - name: Run tests
        env:
          AGYN_RUNNERS_VOLUME_TEST_DSN: postgres://postgres:runners-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/runners_volume_acceptance?sslmode=disable
        run: go test -race ./... -count=1 -timeout=3m

      - name: Build
        run: go build ./...
