name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: runners_volume_acceptance
          POSTGRES_PASSWORD: runners-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d runners_volume_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install buf
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.66.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate protobuf bindings
        run: |
          buf generate buf.build/agynio/api \
            --include-imports \
            --path agynio/api/agents/v1 \
            --path agynio/api/runner/v1 \
            --path agynio/api/runners/v1 \
            --path agynio/api/identity/v1 \
            --path agynio/api/authorization/v1 \
            --path agynio/api/ziti_management/v1 \
            --path agynio/api/notifications/v1

      - name: Run tests
        env:
          AGYN_RUNNERS_VOLUME_TEST_DSN: postgres://postgres:runners-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/runners_volume_acceptance?sslmode=disable
        run: go test -race ./... -count=1 -timeout=3m

      - name: Build
        run: go build ./...
